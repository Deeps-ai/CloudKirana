function App(){const [page,setPage]=useState('landing');const [name,setName]=useState('Aarav Foods Pvt. Ltd.');const [cartCount,setCartCount]=useState(0);const [toast,setToast]=useState('');const notify=m=>{setToast(m);setTimeout(()=>setToast(''),2300)};const addToCart=()=>{setCartCount(count=>count+1);notify('Added to your cart')};let content=page==='landing'?null:page==='seller-roles'?<SellerRoles setPage={setPage}/>:page==='login'?<Login setPage={setPage} notify={notify}/>:page==='register'?<Register setPage={setPage} setName={setName}/>:page==='retailer-register'?<SellerForm type="retailer" setPage={setPage} setName={setName}/>:page==='wholesaler-register'?<SellerForm type="wholesaler" setPage={setPage} setName={setName}/>:page==='dashboard'?<Dashboard setPage={setPage}/>:page==='products'?<Products setPage={setPage}/>:page==='add-product'?<AddProduct setPage={setPage} notify={notify}/>:page==='compliance'?<Compliance setPage={setPage}/>:page==='identity'?<Identity notify={notify}/>:page==='batches'?<Batches/>:page==='inventory'?<Inventory/>:page==='invoices'?<Invoices notify={notify}/>:page==='dispatch'?<Dispatch notify={notify}/>:page==='consumer'?<Consumer setPage={setPage} add={addToCart} cartCount={cartCount}/>:page==='cart'?<Cart setPage={setPage}/>:page==='payment'?<Payment setPage={setPage}/>:page==='tracking'?<Tracking setPage={setPage} notify={notify}/>:<Support notify={notify} setPage={setPage}/>;return <><Splash/>{page==='landing'?<Landing go={setPage}/>:<Layout page={page} setPage={setPage} name={name}>{content}</Layout>}{toast&&<div className="toast show">{toast}</div>}</>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
const consumerProductImages={

	'Maggi Noodles':'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=700&q=85',
	'ABC Biscuits':'https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=700&q=85',
	'Rice':'https://images.unsplash.com/photo-1536304993881-ff6e9e95f567?auto=format&fit=crop&w=700&q=85'
};
const consumerMeta={
	'Tata Salt':{brand:'Tata Consumer',expiry:'Best before: 24 months',price:28,oldPrice:32,discount:'12% off'},
	'Maggi Noodles':{brand:'Nestle India',expiry:'Best before: 9 months',price:14,oldPrice:16,discount:'13% off'},
	'ABC Biscuits':{brand:'Aarav Foods',expiry:'Best before: 6 months',price:30,oldPrice:35,discount:'14% off'}
};
function enhanceConsumerView(){
	document.querySelectorAll('.products-grid .card').forEach(card=>{
		const title=card.querySelector('h3');
		if(!title||!consumerMeta[title.textContent.trim()]||card.dataset.enhanced)return;
		const name=title.textContent.trim(); const meta=consumerMeta[name]; card.dataset.enhanced='true';
		const visual=card.querySelector('.product-img');
		if(visual){visual.textContent=''; const image=document.createElement('img'); image.src=consumerProductImages[name]||consumerProductImages[Object.keys(consumerProductImages).find(key=>name.includes(key))]||consumerProductImages['ABC Biscuits']; image.alt=name; visual.appendChild(image)}
		const details=document.createElement('div'); details.className='product-card-meta'; details.innerHTML='<span class="tiny">Brand: <b>'+meta.brand+'</b></span><span class="tiny">Expiry: <b>'+meta.expiry+'</b></span><span class="tiny">Quality: <b>Verified batch</b> · ★ '+card.querySelector('.tiny').textContent.replace('★','').trim()+'</span>';
		const oldLine=card.querySelector('.tiny'); if(oldLine)oldLine.replaceWith(details);
		const price=card.querySelector('b'); if(price){price.parentElement.className='price-line';price.innerHTML='₹'+meta.price+' <del>₹'+meta.oldPrice+'</del> <span class="discount">'+meta.discount+'</span>'}
	});
	const pageTitle=document.querySelector('.page h1');
	if(pageTitle&&pageTitle.textContent.trim()==='Fresh from nearby'&&!document.querySelector('.consumer-back')){
		const back=document.createElement('button'); back.className='btn soft consumer-back'; back.innerHTML='<i class="fa-solid fa-arrow-left"></i> Back'; back.onclick=()=>document.querySelector('.side-bottom .nav:last-child')?.click(); pageTitle.closest('.page').prepend(back);
	}
	document.querySelectorAll('.side-bottom button,.top-exit').forEach(button=>{if(button.textContent.trim()==='Exit'){button.innerHTML='<i class="fa-solid fa-arrow-right-from-bracket"></i> Logout'}});
	const cartHeading=[...document.querySelectorAll('.page h1')].find(node=>node.textContent.trim()==='Your cart');
	if(cartHeading&&!cartHeading.closest('.page').querySelector('.delivery-note')){
		const bill=cartHeading.closest('.page').querySelector('.checks');
		if(bill){const delivery=document.createElement('div');delivery.className='check delivery-note';const itemTotal=72;const deliveryCharge=itemTotal>500?0:25;delivery.innerHTML='<span>Delivery charge</span><b>'+ (deliveryCharge?'₹'+deliveryCharge:'FREE') +'</b>';const total=bill.querySelector('.check:last-child');bill.insertBefore(delivery,total);const totalValue=total?.querySelector('h3:last-child');if(totalValue)totalValue.textContent='₹'+(itemTotal+deliveryCharge+2).toFixed(2)}
	}
}
new MutationObserver(enhanceConsumerView).observe(document.getElementById('root'),{childList:true,subtree:true});
enhanceConsumerView();
